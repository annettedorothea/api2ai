openapi: 3.0.3
info:
    title: Banking API (demo)
    description: Local demo API for banking MCP — portal JWT only (token exchange required).
    version: 0.1.0
servers:
    - url: http://127.0.0.1:3858
paths:
    /accounts:
        get:
            operationId: list-my-accounts
            summary: List accounts for the authenticated customer
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Customer accounts
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    customerId:
                                        type: string
                                    accounts:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                accountId:
                                                    type: string
                                                label:
                                                    type: string
                                                currency:
                                                    type: string
                '401':
                    description: Missing or invalid portal token
    /accounts/{accountId}/balance:
        get:
            operationId: get-account-balance
            summary: Get balance for one account
            security:
                - bearerAuth: []
            parameters:
                - name: accountId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Account balance
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    accountId:
                                        type: string
                                    balance:
                                        type: number
                                    currency:
                                        type: string
                '401':
                    description: Missing or invalid portal token
                '403':
                    description: Account not accessible for this customer
                '404':
                    description: Unknown account
    /accounts/all:
        get:
            operationId: list-all-accounts
            summary: List all accounts (admin only)
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: All demo accounts
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    role:
                                        type: string
                                    accounts:
                                        type: array
                                        items:
                                            type: object
                '401':
                    description: Missing or invalid portal token
                '403':
                    description: Admin role required
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
