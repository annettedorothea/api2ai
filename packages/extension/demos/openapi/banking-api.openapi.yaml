openapi: 3.0.3
info:
    title: Banking API (demo)
    description: Local demo banking API — accepts only opaque API tokens (from credential transform module), not IdP JWTs.
    version: 0.1.0
servers:
    - url: http://127.0.0.1:3858
paths:
    /accounts/{customerId}:
        get:
            operationId: list-customer-accounts
            summary: List bank accounts for a customer
            description: Requires opaque API Bearer token. Role=user path customerId must match token claim; admin may read any customer.
            security:
                - bearerAuth: []
            parameters:
                - name: customerId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Account list
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    customerId:
                                        type: string
                                    role:
                                        type: string
                                    accounts:
                                        type: array
                                        items:
                                            type: object
                '401':
                    description: Missing or invalid token
    /accounts/{accountId}/transactions:
        get:
            operationId: list-account-transactions
            summary: List transactions for a bank account
            description: Requires opaque API Bearer token.
            security:
                - bearerAuth: []
            parameters:
                - name: accountId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Transaction list
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    accountId:
                                        type: string
                                    customerId:
                                        type: string
                                    transactions:
                                        type: array
                                        items:
                                            type: object
                '401':
                    description: Missing or invalid token
                '404':
                    description: Account not found
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: opaque
