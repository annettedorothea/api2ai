openapi: 3.0.3
info:
    title: Bookings API (demo)
    description: Local demo API for vacation rental bookings (JWT Bearer, OAuth MCP).
    version: 0.1.0
servers:
    - url: http://127.0.0.1:3847
paths:
    /vacation-rentals:
        get:
            operationId: list-vacation-rentals
            summary: List vacation rental units (public availability)
            description: |
                Public endpoint — no auth. Returns availability periods per unit (no guest identity).
                Use query limit to cap how many units are returned (max 10).
            parameters:
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 10
            responses:
                '200':
                    description: Vacation rental units (public view)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    limit:
                                        type: integer
                                    units:
                                        type: array
                                        items:
                                            type: object
    /bookings:
        get:
            operationId: list-all-bookings
            summary: List all bookings across customers (admin only)
            description: Requires Bearer JWT with role=admin. Returns bookings from all customers, capped by limit (max 10).
            security:
                - bearerAuth: []
            parameters:
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 10
            responses:
                '200':
                    description: Cross-customer booking list
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    role:
                                        type: string
                                    limit:
                                        type: integer
                                    bookings:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                bookingId:
                                                    type: string
                                                customerId:
                                                    type: string
                                                unitId:
                                                    type: string
                                                checkIn:
                                                    type: string
                                                    format: date
                                                checkOut:
                                                    type: string
                                                    format: date
                '401':
                    description: Missing or invalid token
                '403':
                    description: Admin role required
    /bookings/{customerId}:
        get:
            operationId: list-customer-bookings
            summary: List bookings for a customer
            description: Requires Bearer JWT; role=user path customerId must match JWT claim; admin may read any customer.
            security:
                - bearerAuth: []
            parameters:
                - name: customerId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Booking list
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    customerId:
                                        type: string
                                    bookings:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                bookingId:
                                                    type: string
                                                unitId:
                                                    type: string
                                                checkIn:
                                                    type: string
                                                    format: date
                                                checkOut:
                                                    type: string
                                                    format: date
                '401':
                    description: Missing or invalid token
                '403':
                    description: Token customerId does not match path
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
