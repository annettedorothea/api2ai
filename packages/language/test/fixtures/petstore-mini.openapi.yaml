openapi: 3.0.3
info:
    title: Petstore Mini
    version: 1.0.0
paths:
    /pet/{petId}:
        get:
            operationId: getPetById
            parameters:
                - name: petId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: OK
    /pet:
        post:
            operationId: addPet
            responses:
                '200':
                    description: OK
